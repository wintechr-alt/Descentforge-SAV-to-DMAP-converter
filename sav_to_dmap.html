const DECOR_PREFIX_TO_CATALOG_ID = [
  ["pillar_short", "PillarShort"],
  ["pillar short", "PillarShort"],
  ["stone table", "StoneTable"],
  ["round table", "RoundTable"],
  ["small table", "StoneTable"],
  ["bookshelf", "Shelf"],
  ["chest", "Chest"],
  ["door", "Door"],
  ["archway", "Archway"],
  ["staircase", "Staircase"],
  ["cauldron", "Cauldron"],
  ["terrain_cauldron", "Cauldron"],
  ["reward cauldron", "Cauldron"],
  ["lectern", "Lectern"],
  ["altar", "Lectern"],
  ["well", "Well"],
  ["interact token", "InteractToken"],
  ["exploration token", "SightToken"],
  ["pillar", "Pillar"],
];
const DECOR_SKIP_PREFIXES = ["dt ","pre logic","post logic","initalizer","@","quest","worldmapdt","tutorialdt","large table preview dt","large table interact dt","small table preview dt","small table interact dt","underlay-","searchevent"];
const DECOR_SKIP_EXACT = new Set(["books","bottles","baubles"]);
const DECOR_UNMAPPED_PREFIXES = ["chains"];
const ELEMENTAL_STONE_NAMES = new Set(["anemos stone","aquos stone","ignos stone","lumos stone","mortos stone","terros stone","umbros stone","vigos stone"]);

function rotCell(x,y,r){ r=((r||0)%360+360)%360; if(r===90) return [-y,x]; if(r===180) return [-x,-y]; if(r===270) return [y,-x]; return [x,y]; }
function quatYawDeg(q){ let yaw = (2*Math.atan2(q.y,q.w))*180/Math.PI % 360; return Math.round(yaw/90)*90 % 360; }
function levelFromY(y){ return y < 0.55 ? 0 : 1; }
function stripInstanceSuffix(name){ return name.replace(/\s*\(\d+\)\s*$/,"").trim(); }

function reconstructTilePlacement(entity, tileDef){
  const rot = quatYawDeg(entity.WorldRot);
  const cells = tileDef.cells;
  const rotated = cells.map(([cx,cy]) => rotCell(cx,cy,rot));
  const xs = rotated.map(c=>c[0]); const ys = rotated.map(c=>c[1]);
  const bbox_cx = (Math.min(...xs)+Math.max(...xs))/2;
  const bbox_cy = (Math.min(...ys)+Math.max(...ys))/2;
  const anchor_x = entity.WorldPos.x - bbox_cx;
  const anchor_y = entity.WorldPos.z - bbox_cy;
  const ax = Math.round(anchor_x); const ay = Math.round(anchor_y);
  const off_x = Math.abs(anchor_x-ax); const off_y = Math.abs(anchor_y-ay);
  const level = levelFromY(entity.WorldPos.y);
  return { placement:{tile:tileDef.id, pos:[ax,ay], rot, level}, slop:Math.max(off_x,off_y) };
}

function tileAbsoluteCells(tileEntry, tilesCatalog){
  const tdef = tilesCatalog[tileEntry.tile];
  const ax=tileEntry.pos[0], ay=tileEntry.pos[1];
  return tdef.cells.map(([cx,cy]) => { const r=rotCell(cx,cy,tileEntry.rot); return [ax+r[0], ay+r[1]]; });
}

function catalogWh(catalogId, interactablesCatalog){
  const e = interactablesCatalog.find(x=>x.id===catalogId);
  return e ? [e.w||1, e.h||1] : [1,1];
}

function interactableFootprint(pos,w,h,rot){
  rot=((rot||0)%360+360)%360;
  let cw=w, ch=h; if(rot===90||rot===270){ cw=h; ch=w; }
  const [px,py]=pos;
  const out=[]; for(let dx=0;dx<cw;dx++) for(let dy=0;dy<ch;dy++) out.push([px+dx, py+dy]);
  return out;
}

function matchDecorCatalogId(rawKey){
  let best=null;
  for(const [prefix,catalogId] of DECOR_PREFIX_TO_CATALOG_ID){
    if(rawKey.startsWith(prefix) && (best===null || prefix.length>best[0].length)) best=[prefix,catalogId];
  }
  return best ? best[1] : null;
}

function isQuestLogicEntity(rawKey){
  if(rawKey.endsWith(" dt")) return true;
  for(const m of ["defeat"," logic","activation","tactic selection","objective updated"]) if(rawKey.includes(m)) return true;
  return false;
}

function reconstructDecorPlacement(entity, catalogId, interactablesCatalog){
  const rot = quatYawDeg(entity.WorldRot);
  let w=1,h=1;
  if(catalogId){ const wh=catalogWh(catalogId,interactablesCatalog); w=wh[0]; h=wh[1]; }
  const eff = (rot===90||rot===270)?[h,w]:[w,h];
  const anchor_x = entity.WorldPos.x - (eff[0]-1)/2;
  const anchor_z = entity.WorldPos.z - (eff[1]-1)/2;
  const ax=Math.round(anchor_x); const az=Math.round(anchor_z);
  const level=levelFromY(entity.WorldPos.y);
  const type = catalogId || stripInstanceSuffix(entity.Name);
  return { type, pos:[ax,az], level, rot, name:entity.Name, text:"", behavior:"official", uses:"", freeAction:false,
    loot:{mode:"none",items:[],traits:[],points:0},
    cells: interactableFootprint([ax,az],w,h,rot) };
}

function tilesCatalogToObj(tilesArrOrObj){
  if(Array.isArray(tilesArrOrObj)){ const o={}; for(const t of tilesArrOrObj) o[t.id]=t; return o; }
  return tilesArrOrObj;
}

function convert(savData, tilesCatalogRaw, interactablesCatalogRaw){
  const tilesCatalog = tilesCatalogToObj(tilesCatalogRaw);
  const interactablesCatalog = Array.isArray(interactablesCatalogRaw) ? interactablesCatalogRaw : Object.values(interactablesCatalogRaw);
  const gsd = savData.GameSceneData;
  const entities = gsd.SceneEntities;
  const report = [];

  const tileEntries=[];
  const tileWarnings=[];
  for(const e of entities){
    const key = e.Name.toLowerCase();
    if(Object.prototype.hasOwnProperty.call(tilesCatalog,key) && e.IsVisible){
      const tileDef = tilesCatalog[key];
      const {placement,slop} = reconstructTilePlacement(e,tileDef);
      tileEntries.push(placement);
      if(slop > 1e-4) tileWarnings.push(`${e.Name}: anchor rounded with slop ${slop.toFixed(4)} (expected ~0)`);
    }
  }
  report.push(`## Tiles placed: ${tileEntries.length}`);
  if(tileWarnings.length){ report.push("**Tile anchor warnings:**"); for(const w of tileWarnings) report.push(`- ${w}`); }
  report.push("");
  const hidden = entities.filter(e=>Object.prototype.hasOwnProperty.call(tilesCatalog,e.Name.toLowerCase()) && !e.IsVisible).map(e=>e.Name);
  if(hidden.length) report.push(`## Tiles present in save but not yet revealed (excluded): ${JSON.stringify(hidden)}\n`);

  const interactableEntries=[];
  const unmapped=[];
  for(const e of entities){
    const rawKey = stripInstanceSuffix(e.Name).toLowerCase();
    if(DECOR_SKIP_EXACT.has(rawKey)) continue;
    if(DECOR_SKIP_PREFIXES.some(p=>rawKey.startsWith(p))) continue;
    if(Object.prototype.hasOwnProperty.call(tilesCatalog,rawKey)) continue;
    if(isQuestLogicEntity(rawKey)) continue;
    if(!e.IsVisible) continue;
    if(ELEMENTAL_STONE_NAMES.has(rawKey) || DECOR_UNMAPPED_PREFIXES.some(p=>rawKey.startsWith(p))){
      interactableEntries.push(reconstructDecorPlacement(e,null,interactablesCatalog));
      unmapped.push(e.Name); continue;
    }
    const cid = matchDecorCatalogId(rawKey);
    if(cid){ interactableEntries.push(reconstructDecorPlacement(e,cid,interactablesCatalog)); }
    else {
      interactableEntries.push(reconstructDecorPlacement(e,null,interactablesCatalog));
      unmapped.push(e.Name);
    }
  }
  report.push(`## Interactables placed: ${interactableEntries.length}`);
  if(unmapped.length) report.push(`**Unmapped types (no catalog id -- verify manually before loading in DescentForge):** ${JSON.stringify(unmapped)}\n`);

  report.push("## Enemies and hero start are not reconstructed by this script -- set spawns.heroStart and spawns.enemies by hand if needed.\n");

  const allXy=[];
  for(const t of tileEntries) allXy.push(...tileAbsoluteCells(t,tilesCatalog));
  for(const it of interactableEntries) for(const c of it.cells) allXy.push([c[0],c[1]]);

  let min_x=0,min_y=0;
  if(allXy.length){ min_x=Math.min(...allXy.map(c=>c[0])); min_y=Math.min(...allXy.map(c=>c[1])); }
  const off_x=-min_x, off_y=-min_y;
  if(off_x||off_y){
    for(const t of tileEntries){ t.pos=[t.pos[0]+off_x, t.pos[1]+off_y]; }
    for(const it of interactableEntries){ it.pos=[it.pos[0]+off_x, it.pos[1]+off_y]; it.cells=it.cells.map(c=>[c[0]+off_x,c[1]+off_y]); }
    report.push(`## Grid normalization: shifted everything by (+${off_x}, +${off_y}) so the occupied bounding box starts at (0,0).\n`);
  }

  const allLevelsSet = new Set(tileEntries.length? tileEntries.map(t=>t.level) : [0]);
  const allLevels = Array.from(allLevelsSet).sort();
  const gridX = allXy.length? (Math.max(...allXy.map(c=>c[0])) + off_x + 1) : 1;
  const gridY = allXy.length? (Math.max(...allXy.map(c=>c[1])) + off_y + 1) : 1;

  const dmap = {
    format:"dmap", version:2,
    meta:{
      id:"sav_import",
      name: ((savData.PartyName||"") + " (imported)").trim(),
      author:"",
      description:"Imported from a Descent: Legends of the Dark save file via sav_to_dmap",
      difficulty:"normal",
      heroCount:[1,4],
      intro:"",
      music:{file:"",title:"",when:"map",loop:true,url:""},
      created: new Date().toISOString().slice(0,10),
    },
    board:{ gridSize:[gridX,gridY], levels:(Math.max(...allLevels)+1)||1, tiles:tileEntries, blocked:[], floor:"flagstone" },
    spawns:{ heroStart:[], enemies:[], interactables:interactableEntries },
    objectives:{ primary:[], optional:[], failConditions:[{id:"all_heroes_defeated",params:{}}] },
    triggers:[],
  };

  return { dmap, report: report.join("\n") };
}

function log(msg){ document.getElementById('log').textContent += msg + "\n"; }

function loadCatalogs(){ return {tilesRaw:EMBEDDED_TILES, interRaw:EMBEDDED_INTERACTABLES}; }

let lastDmap=null, lastReport=null;

document.getElementById('runBtn').addEventListener('click', async ()=>{
  document.getElementById('log').textContent='';
  const savInput = document.getElementById('savFile').files[0];
  if(!savInput){ log('Please choose a .sav file.'); return; }
  const {tilesRaw, interRaw} = loadCatalogs();
  if(!tilesRaw){ log('Tiles catalog missing.'); return; }
  if(!interRaw){ log('Interactables catalog missing.'); return; }
  try {
    const savData = JSON.parse(await savInput.text());
    const {dmap, report} = convert(savData, tilesRaw, interRaw);
    lastDmap=dmap; lastReport=report;
    log(report);
    log(`\nWrote ${dmap.board.tiles.length} tiles, ${dmap.spawns.interactables.length} interactables. Grid ${dmap.board.gridSize}.`);
    document.getElementById('dlDmap').disabled=false;
    document.getElementById('dlReport').disabled=false;
  } catch(err){ log('ERROR: '+err); console.error(err); }
});

function download(filename, content, mime){
  const blob = new Blob([content], {type:mime});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href=url; a.download=filename; document.body.appendChild(a); a.click();
  document.body.removeChild(a); URL.revokeObjectURL(url);
}

document.getElementById('dlDmap').addEventListener('click', ()=>{
  if(lastDmap) download('imported.dmap', JSON.stringify(lastDmap,null,2), 'application/json');
});
document.getElementById('dlReport').addEventListener('click', ()=>{
  if(lastReport) download('import_report.md', lastReport, 'text/markdown');
});
